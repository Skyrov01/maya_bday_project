<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maya's Light ✦</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
  <audio id="bg-audio" src="./assets/sounds/background_sound.mp3" loop preload="auto"></audio>
</head>
<body>

  <!-- ── Landing page ───────────────────────────────────────────── -->
  <div id="landing">
    <img src="./assets/images/sky-bg-04.png" alt="" class="landing__bg" aria-hidden="true" />
    <div class="stars-layer" aria-hidden="true"></div>
    <div class="landing__content">
      <h1 class="landing__name">Happy Birthday, Maya!</h1>
      <p class="landing__greeting"></p>
      <p class="landing__message" hidden></p>
      <button id="btn-open" class="landing__open-btn">Open your gift ✦</button>
    </div>
  </div>

  <!-- ── Controller starfield (behind everything) ───────────────── -->
  <div id="controller-stars" class="stars-layer controller-stars" aria-hidden="true"></div>

  <!-- ── Connection bar ─────────────────────────────────────────── -->
  <header class="topbar">
    <button id="btn-back" class="topbar__back" title="Return to the sky">✦</button>
    <span class="topbar__title">Maya's Light ✦</span>
    <div class="topbar__conn">
      <input id="ip-input" type="text" placeholder="192.168.x.x"
             autocomplete="off" autocorrect="off" spellcheck="false" />
      <button id="btn-connect">Find the Light</button>
      <span id="conn-status" class="status status--off" title="Disconnected">●</span>
    </div>
  </header>

  <!-- ── Mixed-content warning (hidden by default) ──────────────── -->
  <div id="mixed-content-banner" class="banner banner--warn" hidden>
    <strong>Allow insecure content</strong> — this app is on HTTPS but your
    Wemos uses plain HTTP. In Chrome: click the lock icon → Site settings →
    Insecure content → Allow. In Firefox: click the shield icon → Disable
    protection. Then reload.
    <button class="banner__close" id="dismiss-banner">✕</button>
  </div>

  <!-- ── Tabs ───────────────────────────────────────────────────── -->
  <nav class="tabs" role="tablist">
    <button class="tab tab--active" data-tab="control"  role="tab">Paint the Sky</button>
    <button class="tab"             data-tab="effects"  role="tab">Constellations</button>
    <button class="tab"             data-tab="patterns" role="tab">Stories</button>
  </nav>

  <!-- ── Control tab ────────────────────────────────────────────── -->
  <section id="tab-control" class="tab-panel">
    <div class="section-title">Your Stars
      <button id="btn-all-off" class="btn btn--sm btn--danger">Let It Fade</button>
      <button id="btn-fill"    class="btn btn--sm">Paint the Night</button>
      <input  id="fill-color"  type="color" value="#ff0000" title="Fill colour" />
    </div>
    <div id="led-grid" class="led-grid">
      <!-- Populated by led-grid.js -->
    </div>
    <div class="brightness-row">
      <label for="brightness-slider">Star Glow</label>
      <input id="brightness-slider" type="range" min="0" max="255" value="32" />
      <span  id="brightness-value">32</span>
    </div>
  </section>

  <!-- ── Effects tab ────────────────────────────────────────────── -->
  <section id="tab-effects" class="tab-panel" hidden>
    <div id="effects-panel">
      <!-- Populated by effects-panel.js -->
    </div>
  </section>

  <!-- ── Patterns tab ───────────────────────────────────────────── -->
  <section id="tab-patterns" class="tab-panel" hidden>
    <div id="pattern-editor">
      <!-- Populated by pattern-editor.js -->
    </div>
    <hr class="divider" />
    <div id="storage-panel">
      <!-- Populated by storage-panel.js -->
    </div>
  </section>

  <script type="module" src="./js/stars.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
